<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EmoSense — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080c;--surface:#0d0f18;--card:#111420;
  --border:rgba(255,255,255,0.07);--border-hl:rgba(255,255,255,0.14);
  --cyan:#00e5ff;--violet:#9d4edd;--lime:#b5ff2d;--coral:#ff5c5c;
  --text-1:#eef0f8;--text-2:#8a8fa8;--text-3:#3e4258;
  --font-d:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--text-1);font-family:var(--font-b)}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,black 20%,transparent 100%)}
.glow{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.glow-1{width:500px;height:500px;background:var(--violet);opacity:.08;top:-100px;left:-100px}
.glow-2{width:400px;height:400px;background:var(--cyan);opacity:.06;bottom:-100px;right:-100px}

/* Nav */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(7,8,12,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text-1)}
.nav-logo span{font-family:var(--font-d);font-size:16px;font-weight:800}
.nav-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--border);transition:border-color .2s,color .2s}
.nav-back:hover{color:var(--text-1);border-color:var(--border-hl)}

/* Layout */
.page{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:40px 24px 80px}
.page-header{margin-bottom:36px}
.page-title{font-family:var(--font-d);font-size:2rem;font-weight:800;letter-spacing:-.8px}
.page-sub{color:var(--text-2);font-size:14px;margin-top:6px}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:36px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 18px}
.stat-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.stat-value{font-family:var(--font-d);font-size:2rem;font-weight:800}
.stat-value.cyan{color:var(--cyan)}.stat-value.violet{color:#b07ef5}.stat-value.lime{color:var(--lime)}

/* Emotion bar chart */
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:36px}
.section-title{font-family:var(--font-d);font-size:1rem;font-weight:700;margin-bottom:18px;letter-spacing:-.3px}
.emotion-bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:90px 1fr 48px;align-items:center;gap:12px;font-size:13px}
.bar-label{color:var(--text-2);text-transform:capitalize}
.bar-track{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.25,.8,.25,1)}
.bar-count{text-align:right;color:var(--text-2);font-size:12px}

/* Filter row */
.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13px;cursor:pointer;transition:all .2s;font-family:var(--font-b)}
.filter-btn.active,.filter-btn:hover{color:var(--text-1);border-color:var(--border-hl);background:rgba(255,255,255,.05)}
.filter-btn.active{border-color:var(--cyan);color:var(--cyan)}
.spacer{flex:1}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13px;cursor:pointer;transition:all .2s;font-family:var(--font-b)}
.refresh-btn:hover{color:var(--text-1);border-color:var(--border-hl)}

/* Table */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 18px;text-align:left;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
td{padding:13px 18px;font-size:13px;vertical-align:middle}
.td-emotion{display:flex;align-items:center;gap:8px;font-weight:500}
.emotion-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.td-confidence{color:var(--text-2)}
.type-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.type-badge.image{background:rgba(0,229,255,.1);color:var(--cyan);border:1px solid rgba(0,229,255,.2)}
.type-badge.audio{background:rgba(157,78,221,.1);color:#b07ef5;border:1px solid rgba(157,78,221,.2)}
.source-tag{font-size:11px;color:var(--text-3);text-transform:capitalize}
.td-time{color:var(--text-3);font-size:12px}
.del-btn{background:transparent;border:none;cursor:pointer;color:var(--text-3);padding:4px 6px;border-radius:6px;transition:color .2s,background .2s;font-size:14px}
.del-btn:hover{color:var(--coral);background:rgba(255,92,92,.08)}

/* States */
.empty{padding:60px 20px;text-align:center;color:var(--text-3)}
.empty-icon{font-size:36px;margin-bottom:12px}
.loading{padding:40px;text-align:center;color:var(--text-2);font-size:14px}
.mongo-warn{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.2);border-radius:12px;padding:14px 18px;font-size:13px;color:#ff8a8a;margin-bottom:24px;display:none}

@media(max-width:640px){
  .nav{padding:14px 18px}
  .page{padding:24px 16px 60px}
  thead th:nth-child(4),td:nth-child(4){display:none}
  thead th:nth-child(5),td:nth-child(5){display:none}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<nav class="nav">
  <a class="nav-logo" href="index.html">🧠 <span>EmoSense</span></a>
  <a class="nav-back" href="index.html">← Back</a>
</nav>

<main class="page">
  <div class="page-header">
    <div class="page-title">Detection History</div>
    <div class="page-sub">All past emotion detections stored in MongoDB</div>
  </div>

  <div class="mongo-warn" id="mongoWarn">⚠️ MongoDB is offline — results are not being saved. Start MongoDB and restart the Flask API.</div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-label">Total Image</div><div class="stat-value cyan" id="statImage">—</div></div>
    <div class="stat-card"><div class="stat-label">Total Audio</div><div class="stat-value violet" id="statAudio">—</div></div>
    <div class="stat-card"><div class="stat-label">All Detections</div><div class="stat-value lime" id="statAll">—</div></div>
  </div>

  <!-- Emotion bar chart -->
  <div class="chart-section">
    <div class="section-title">Emotion Distribution</div>
    <div class="emotion-bars" id="emotionBars"><div class="loading">Loading…</div></div>
  </div>

  <!-- History table -->
  <div class="filter-row">
    <button class="filter-btn active" data-type="">All</button>
    <button class="filter-btn" data-type="image">📷 Image</button>
    <button class="filter-btn" data-type="audio">🎙️ Audio</button>
    <div class="spacer"></div>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Emotion</th>
          <th>Type</th>
          <th>Confidence</th>
          <th>Source</th>
          <th>Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="historyBody"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const API = 'http://localhost:5000';
let activeFilter = '';

const EMOTION_COLORS = {
  happy:'#b5ff2d', sad:'#00e5ff', angry:'#ff5c5c', fearful:'#ff9d4d',
  disgusted:'#9d4edd', surprised:'#f5d020', neutral:'#8a8fa8'
};

function relTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60)  return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60)  return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h}h ago`;
  return new Date(iso).toLocaleDateString();
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/api/stats`);
    const d = await r.json();
    if (!d.success) return;

    const { totals, combined } = d.stats;
    document.getElementById('statImage').textContent = totals.image;
    document.getElementById('statAudio').textContent = totals.audio;
    document.getElementById('statAll').textContent   = totals.image + totals.audio;

    const max   = Math.max(1, ...Object.values(combined));
    const order = ['happy','sad','angry','fearful','disgusted','surprised','neutral'];
    const sorted = order.filter(e => combined[e] !== undefined)
                        .concat(Object.keys(combined).filter(e => !order.includes(e)));

    document.getElementById('emotionBars').innerHTML = sorted.map(e => `
      <div class="bar-row">
        <span class="bar-label">${e}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${(combined[e]/max*100).toFixed(1)}%;background:${EMOTION_COLORS[e]||'#666'}"></div>
        </div>
        <span class="bar-count">${combined[e]}</span>
      </div>
    `).join('') || '<div style="color:var(--text-3);font-size:13px">No data yet</div>';
  } catch(e) {
    document.getElementById('emotionBars').innerHTML = '<div style="color:var(--text-3);font-size:13px">Stats unavailable</div>';
  }
}

async function loadHistory(type = '') {
  const tbody = document.getElementById('historyBody');
  tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading…</td></tr>';
  try {
    const url = `${API}/api/history?limit=100${type ? '&type='+type : ''}`;
    const r   = await fetch(url);
    const d   = await r.json();

    if (!d.success) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty"><div class="empty-icon">⚠️</div>${d.error}</td></tr>`;
      return;
    }
    if (!d.records.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty"><div class="empty-icon">🫙</div>No detections yet — run an analysis first.</td></tr>`;
      return;
    }

    tbody.innerHTML = d.records.map(rec => `
      <tr id="row-${rec._id}">
        <td><div class="td-emotion">
          <span class="emotion-dot" style="background:${EMOTION_COLORS[rec.dominant_emotion]||'#666'}"></span>
          ${rec.dominant_emotion}
        </div></td>
        <td><span class="type-badge ${rec.type}">${rec.type === 'image' ? '📷' : '🎙️'} ${rec.type}</span></td>
        <td class="td-confidence">${rec.confidence ?? '—'}%</td>
        <td><span class="source-tag">${rec.source || '—'}</span></td>
        <td class="td-time">${rec.timestamp ? relTime(rec.timestamp) : '—'}</td>
        <td><button class="del-btn" title="Delete" onclick="deleteRecord('${rec._id}')">✕</button></td>
      </tr>
    `).join('');
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty"><div class="empty-icon">🔌</div>Cannot reach API — is Flask running?</td></tr>`;
  }
}

async function deleteRecord(id) {
  if (!confirm('Delete this record?')) return;
  try {
    const r = await fetch(`${API}/api/history/${id}`, {method:'DELETE'});
    const d = await r.json();
    if (d.success) {
      document.getElementById(`row-${id}`)?.remove();
      loadStats();
    } else alert(d.error);
  } catch(e) { alert('Delete failed'); }
}

async function checkMongo() {
  try {
    const r = await fetch(`${API}/health`, {signal: AbortSignal.timeout(3000)});
    const d = await r.json();
    if (!d.mongo) document.getElementById('mongoWarn').style.display = 'block';
  } catch { document.getElementById('mongoWarn').style.display = 'block'; }
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.type;
    loadHistory(activeFilter);
  });
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  loadStats();
  loadHistory(activeFilter);
});

// Boot
checkMongo();
loadStats();
loadHistory();
</script>
</body>
</html>
